<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'">
  <title>Tagliato Fine · Charcuterie · Pizzicheria · Cannes</title>
  <meta name="description" content="Tagliato Fine, café italien à Cannes : focaccias, salades, granita sicilienne, café et aperitivo.">
  <link rel="alternate" hreflang="fr" href="/">
  <link rel="alternate" hreflang="en" href="/en/">
  <link rel="alternate" hreflang="it" href="/it/">
  <link rel="alternate" hreflang="x-default" href="/">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/cormorant-garamond-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#contenu">Aller au contenu</a>

  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="./">
        <img src="img/logo.svg" alt="" width="40" height="40">
        <span>Tagliato Fine</span>
      </a>
      <div class="header-tools">
        <nav aria-label="Langue">
          <ul class="lang-switch">
            <li><a href="./" lang="fr" aria-current="page">FR</a></li>
            <li><a href="en/" lang="en" hreflang="en">EN</a></li>
            <li><a href="it/" lang="it" hreflang="it">IT</a></li>
          </ul>
        </nav>
        <!-- Shown by js/hours.js; useless without JS, so hidden by default. -->
        <button class="theme-toggle" type="button" id="theme-toggle" aria-pressed="false" hidden>
          <span class="visually-hidden">Thème clair ou sombre</span>
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="4.5"/>
            <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>
          </svg>
        </button>
      </div>
    </div>
    <!-- Filled by js/hours.js from data/infos.json. Empty and hidden without JS or with unresolved hours. -->
    <p class="status wrap" id="status" aria-live="polite" hidden></p>
  </header>

  <main id="contenu">
    <section class="wrap" aria-labelledby="hero-title">
      <div class="panel frame hero">
        <!-- Hero photo goes here once the owners supply one (img/hero/, WebP, width/height set). -->
        <h1 class="hero-name" id="hero-title">Tagliato Fine</h1>
        <p class="hero-sub">Charcuterie · Pizzicheria</p>
        <p class="actions"><a class="btn" href="carte.html">Voir la carte</a></p>
      </div>
    </section>

    <!-- Formules active today: rendered by js/menu.js from data/menu.json. -->
    <section class="wrap" id="formules" aria-labelledby="formules-title" hidden>
      <div class="panel">
        <h2 id="formules-title"><span class="script">Nos</span> formules</h2>
        <div id="formules-list"></div>
      </div>
    </section>

    <!-- Signature items (pistacchio, granita, tiramisu) by id from data/menu.json. -->
    <section class="wrap" id="signatures" aria-labelledby="signatures-title" hidden>
      <div class="panel">
        <h2 id="signatures-title"><span class="script">Nos</span> incontournables</h2>
        <div id="signatures-list"></div>
      </div>
    </section>

    <section class="wrap" id="acces" aria-labelledby="acces-title">
      <div class="panel">
        <h2 id="acces-title">Nous trouver</h2>
        <!-- Address, landmark, directions and tel: link come from data/infos.json (not yet supplied). -->
        <address id="address"></address>
        <p class="actions" id="contact-actions">
          <a class="btn-quiet btn" href="contact.html">Adresse et horaires</a>
        </p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <!-- Hours summary and Instagram link from data/infos.json. -->
      <p id="footer-hours"></p>
      <ul>
        <li><a href="carte.html">La carte</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="mentions-legales.html">Mentions légales</a></li>
        <li><a href="confidentialite.html">Confidentialité</a></li>
      </ul>
    </div>
  </footer>
</body>
</html>
